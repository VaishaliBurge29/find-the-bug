<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact · BugHunt Shop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="contact">
  <header id="site-header"></header>
  <main>
    <div class="card" style="max-width:560px;margin:0 auto">
      <h1>Contact us</h1>
      <p class="help">Questions about an order? We usually reply within one working day.</p>
      <form class="form" id="contact-form" style="max-width:none">
        <div><label>Name</label><input name="name" required></div>
        <div><label>Email</label><input name="email" type="email" required></div>
        <div>
          <label>Message</label>
          <textarea name="message" rows="6" maxlength="500" required></textarea>
          <small class="help" id="counter">0 / 500 characters</small>
        </div>
        <div id="msg" role="alert"></div>
        <button type="submit">Send message</button>
      </form>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="/js/common.js"></script>
  <script>
    const form = document.getElementById('contact-form');
    form.message.addEventListener('input', () => {
      document.getElementById('counter').textContent = `${form.message.value.length} / 500 characters`;
    });
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await api('/contact', { method: 'POST', body: { name: form.name.value, email: form.email.value, message: form.message.value } });
      const msg = document.getElementById('msg');
      if (!res.ok) { msg.innerHTML = '<div class="notice notice-err">Something went wrong. Please try again.</div>'; return; }
      form.reset();
      document.getElementById('counter').textContent = '0 / 500 characters';
      msg.innerHTML = '<div class="notice notice-ok">Thanks! We will get back to you soon.</div>';
    });
  </script>
</body>
</html>
