<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · BugHunt Shop</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="search">
  <header id="site-header"></header>
  <main>
    <h1 id="heading">Search</h1>
    <div id="results" class="grid"></div>
  </main>
  <footer id="site-footer"></footer>

  <script src="/js/common.js"></script>
  <script>
    async function search() {
      const q = qs('q') || '';
      const heading = document.getElementById('heading');
      const results = document.getElementById('results');
      if (!q) { heading.textContent = 'Search'; results.innerHTML = '<p>Type something in the search box above.</p>'; return; }

      heading.innerHTML = `Results for "${q}"`;
      const { data } = await api('/search?q=' + encodeURIComponent(q));
      if (!data.items.length) { results.innerHTML = '<p>No products match your search.</p>'; return; }
      results.innerHTML = '';
      data.items.forEach((p) => {
        const card = document.createElement('article');
        card.className = 'card product-card';
        card.innerHTML = `
          <a href="/product.html?id=${p.id}"><img src="${productImageSrc(p)}" alt="${escapeHtml(p.name)}"></a>
          <h3><a href="/product.html?id=${p.id}">${escapeHtml(p.name)}</a></h3>
          <div class="meta"><span class="price">${formatEUR(p.price)}</span></div>`;
        results.appendChild(card);
      });
    }
    search();
  </script>
</body>
</html>
